    <script>
        function getApiBase() {
            const savedUrl = localStorage.getItem('interviewiq_backend_url');
            if (savedUrl && savedUrl.trim()) {
                return savedUrl.trim().replace(/\/+$/, '');
            }
            if (window.location.hostname.includes('vercel.app') || window.location.hostname.includes('github.io')) {
                return 'https://interviewiq-api.onrender.com';
            }
            return window.location.origin;
        }

        function promptBackendUrl() {
            const current = localStorage.getItem('interviewiq_backend_url') || getApiBase();
            const input = prompt("Enter your Render Backend URL (e.g. https://your-backend.onrender.com):", current);
            if (input !== null) {
                const clean = input.trim().replace(/\/+$/, '');
                if (clean) {
                    localStorage.setItem('interviewiq_backend_url', clean);
                    alert("Backend URL saved! Reloading candidates...");
                    fetchCandidates().then(() => render());
                } else {
                    localStorage.removeItem('interviewiq_backend_url');
                    alert("Backend URL reset to auto-detect.");
                    fetchCandidates().then(() => render());
                }
            }
        }

        let appState = {
            currentScreen: 'landing',
            candidates: FALLBACK_CANDIDATES,
            selectedCandidate: null,
            sessionId: '',
            transcript: [], // { role, content, focusReason, moduleN, verdict }
            questionsAsked: 0,
            daysCoveredCount: 0,
            daysCoveredSet: new Set(),
            activeModule: 1,
            isTyping: false,
            feedback: null,
            activeEngineeringSection: 'ai_ml',
            selectedPersona: 'Pragmatic Architect',
            showConfigPanel: false,
            userName: localStorage.getItem('interviewiq_user_name') || '',
            ttsEnabled: true
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', async () => {
            await fetchCandidates();
            render();
        });

        async function fetchCandidates() {
            try {
                const res = await fetch(`${getApiBase()}/api/candidates`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.candidates && data.candidates.length > 0) {
                        appState.candidates = data.candidates;
                    }
                }
            } catch (err) {
                console.error("Failed to fetch candidates from API, using fallback data:", err);
            }
        }

        function setEngineeringSection(section) {
            appState.activeEngineeringSection = section;
            appState.showConfigPanel = false;
            appState.selectedCandidate = null;
            render();
        }

        function selectCandidateForConfig(cand) {
            appState.selectedCandidate = cand;
            appState.showConfigPanel = true;
            render();
        }

        function setInterviewerPersona(persona) {
            appState.selectedPersona = persona;
            render();
        }

        function beginInterviewWithSelected() {
            const nameInput = document.getElementById('user-name-input');
            const nameVal = nameInput ? nameInput.value.trim() : '';
            if (!nameVal) {
                alert("Please enter your name to personalize the interview.");
                return;
            }
            appState.userName = nameVal;
            localStorage.setItem('interviewiq_user_name', nameVal);
            if (appState.selectedCandidate) {
                startInterview(appState.selectedCandidate, appState.selectedPersona);
            }
        }

        function cancelConfigPanel() {
            appState.showConfigPanel = false;
            appState.selectedCandidate = null;
            render();
        }

        function getEngineeringSection(role) {
            const r = role.toLowerCase();
            if (r.includes('ai') || r.includes('artificial intelligence') || r.includes('machine learning')) {
                return 'ai_ml';
            }
            if (r.includes('data') || r.includes('backend') || r.includes('software engineer') || r.includes('developer') || r.includes('mobile')) {
                return 'backend_data';
            }
            if (r.includes('devops') || r.includes('system') || r.includes('support') || r.includes('intern') || r.includes('distinguished')) {
                return 'devops_systems';
            }
            return 'product_other';
        }

        // Hamburger Menu Controls
        function toggleMenu() {
            const drawer = document.getElementById('menu-drawer-overlay');
            if (!drawer) return;
            const isHidden = drawer.classList.contains('hidden');
            toggleMenuDrawer(isHidden);
        }

        function toggleMenuDrawer(show) {
            const drawer = document.getElementById('menu-drawer-overlay');
            const panel = document.getElementById('menu-drawer-panel');
            if (!drawer || !panel) return;

            if (show) {
                drawer.classList.remove('hidden');
                setTimeout(() => {
                    drawer.classList.remove('opacity-0');
                    panel.classList.remove('-translate-x-full');
                }, 10);
            } else {
                drawer.classList.add('opacity-0');
                panel.classList.add('-translate-x-full');
                setTimeout(() => {
                    drawer.classList.add('hidden');
                }, 300);
            }
        }

        // Export Reports
        function downloadLatestReport() {
            downloadLatestReportPDF();
        }

        function downloadReportById(id) {
            const history = JSON.parse(localStorage.getItem('interviewiq_history') || '[]');
            const h = history.find(item => item.id === id);
            if (!h) return;
            downloadLatestReportPDFWithParams(h.userName, h.candidateRole, h.persona, h.date, h.feedback);
        }

        function downloadReportText(userName, jobRole, persona, date, f) {
            let md = `# 📊 TECHNICAL ASSESSMENT EVALUATION REPORT\n\n`;
            md += `| Evaluation Parameter | Candidate Detail |\n`;
            md += `| :--- | :--- |\n`;
            md += `| **Candidate Name** | **${userName}** |\n`;
            md += `| **Target Engineering Role** | ${jobRole || "AI / Software Engineer"} |\n`;
            md += `| **Interviewer Persona** | ${persona} |\n`;
            md += `| **Evaluation Date** | ${date} |\n`;
            md += `| **System Version** | interviewIQ Engine V1.0 |\n\n`;
            
            md += `---\n\n`;
            md += `## 📈 Executive Summary\n`;
            md += `${f.summary || "Candidate evaluated across 8+ technical curriculum modules."}\n\n`;
            
            md += `---\n\n`;
            md += `## 📊 Domain Competency Breakdown & Visual Score Visualizer\n\n`;
            md += `| Competency Domain | Mastery Score | Competency Level | Visual Score Bar |\n`;
            md += `| :--- | :---: | :---: | :--- |\n`;
            md += `| **AI & ML Engineering** | **92%** | Expert | \`█████████░\` (92%) |\n`;
            md += `| **Backend & Data Systems** | **84%** | Proficient | \`████████░░\` (84%) |\n`;
            md += `| **Systems & DevOps** | **71%** | Intermediate | \`███████░░░\` (71%) |\n`;
            md += `| **Product & Technical Design** | **65%** | Foundational | \`██████░░░░\` (65%) |\n\n`;

            md += `---\n\n`;

        // --- Speech Recognition (Speech-to-Text) ---
        let recognition = null;
        let isListening = false;

        function toggleSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
                return;
            }

            const micIcon = document.getElementById('mic-icon');
            const input = document.getElementById('message-input');

            if (isListening) {
                if (recognition) recognition.stop();
                isListening = false;
                if (micIcon) micIcon.classList.remove('text-status-error', 'animate-pulse');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = function() {
                isListening = true;
                if (micIcon) micIcon.classList.add('text-status-error', 'animate-pulse');
            };

            recognition.onresult = function(event) {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                if (input) input.value = transcript;
            };

            recognition.onerror = function(event) {
                console.error("Speech recognition error:", event.error);
                isListening = false;
                if (micIcon) micIcon.classList.remove('text-status-error', 'animate-pulse');
            };

            recognition.onend = function() {
                isListening = false;
                if (micIcon) micIcon.classList.remove('text-status-error', 'animate-pulse');
            };

            recognition.start();
        }

        // --- Text-to-Speech (TTS Voice Audio Output) ---
        function toggleTTS() {
            appState.ttsEnabled = !appState.ttsEnabled;
            const ttsIcon = document.getElementById('tts-icon');
            if (ttsIcon) {
                ttsIcon.textContent = appState.ttsEnabled ? 'volume_up' : 'volume_off';
            }
            if (!appState.ttsEnabled && window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
        }

        function speakInterviewerText(text) {
            if (!appState.ttsEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/<[^>]*>?/gm, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // --- Pace Timer (15-Minute Countdown) ---
        let timerInterval = null;
        let secondsRemaining = 900;

        function startInterviewTimer() {
            stopInterviewTimer();
            secondsRemaining = 900;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                if (secondsRemaining > 0) {
                    secondsRemaining--;
                    updateTimerDisplay();
                } else {
                    stopInterviewTimer();
                }
            }, 1000);
        }

        function stopInterviewTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const display = document.getElementById('timer-display');
            const progressBar = document.getElementById('timer-progress-bar');
            if (!display) return;

            const mins = Math.floor(secondsRemaining / 60);
            const secs = secondsRemaining % 60;
            display.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            const percent = (secondsRemaining / 900) * 100;
            if (progressBar) {
                progressBar.style.width = `${percent}%`;
                if (secondsRemaining < 120) {
                    progressBar.className = "bg-status-error h-full transition-all duration-1000";
                    display.className = "font-bold font-label-code text-status-error animate-pulse";
                } else if (secondsRemaining < 300) {
                    progressBar.className = "bg-status-warning h-full transition-all duration-1000";
                    display.className = "font-bold font-label-code text-status-warning";
                } else {
                    progressBar.className = "bg-primary h-full transition-all duration-1000";
                    display.className = "font-bold font-label-code text-primary";
                }
            }
        }

        // Save Interview to History
        function saveInterviewSessionToHistory(userName, candidate, persona, feedback, transcript) {
            try {
                const history = JSON.parse(localStorage.getItem('interviewiq_history') || '[]');
                
                let strong = 0;
                let partial = 0;
                let gap = 0;
                transcript.forEach(t => {
                    if (t.verdict === 'strong') strong++;
                    if (t.verdict === 'partial') partial++;
                    if (t.verdict === 'gap') gap++;
                });

                const record = {
                    id: 'session-' + Date.now(),
                    userName: userName || "Candidate",
                    candidateName: candidate?.member?.name || "Unknown Candidate",
                    candidateRole: candidate?.member?.jobRole || "Software Engineer",
                    persona: persona,
                    date: new Date().toLocaleDateString(),
                    feedback: feedback,
                    score: { strong, partial, gap }
                };
                
                history.push(record);
                localStorage.setItem('interviewiq_history', JSON.stringify(history));
            } catch (err) {
                console.error("Failed to save history:", err);
            }
        }

        async function startInterview(candidate, persona) {
            appState.selectedCandidate = candidate;
            appState.selectedPersona = persona || appState.selectedPersona || 'Pragmatic Architect';
            appState.sessionId = 'session-' + Math.random().toString(36).substr(2, 9);
            appState.transcript = [];
            appState.questionsAsked = 0;
            appState.daysCoveredSet = new Set();
            appState.daysCoveredCount = 0;
            appState.activeModule = 1;
            appState.isTyping = true;
            appState.feedback = null;
            appState.showConfigPanel = false;
            
            navigateTo('interview_interface');

            try {
                const res = await fetch(`${getApiBase()}/api/interview`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: appState.sessionId,
                        candidate: candidate,
                        persona: appState.selectedPersona,
                        userName: appState.userName
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    appState.transcript.push({
                        role: 'interviewer',
                        content: data.reply,
                        focusReason: data.focusReason,
                        moduleN: data.moduleN
                    });
                    appState.questionsAsked = 1;
                    appState.activeModule = data.moduleN || 1;
                    if (data.moduleN) {
                        appState.daysCoveredSet.add(data.moduleN * 3 - 2); 
                        appState.daysCoveredCount = 1;
                    }
                    startInterviewTimer();
                    speakInterviewerText(data.reply);
                } else {
                    appState.transcript.push({
                        role: 'interviewer',
                        content: "Let's begin the interview. Tell me about your environment setup experiences."
                    });
                    startInterviewTimer();
                    speakInterviewerText("Let's begin the interview. Tell me about your environment setup experiences.");
                }
            } catch (err) {
                console.error("START interview failed:", err);
                appState.transcript.push({
                    role: 'interviewer',
                    content: "Welcome. Let's start the session. Can you describe how you configure Python environments?"
                });
                startInterviewTimer();
                speakInterviewerText("Welcome. Let's start the session. Can you describe how you configure Python environments?");
            } finally {
                appState.isTyping = false;
                render();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message || appState.isTyping) return;

            input.value = '';
            
            // Add candidate message
            appState.transcript.push({
                role: 'candidate',
                content: message
            });
            
            appState.isTyping = true;
            render();
            scrollChat();

            try {
                const res = await fetch(`${getApiBase()}/api/interview`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: appState.sessionId,
                        message: message
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    
                    // Update latest candidate message with verdict if returned
                    if (data.verdict) {
                        appState.transcript[appState.transcript.length - 1].verdict = data.verdict;
                    }

                    if (data.done) {
                        // End of interview
                        stopInterviewTimer();
                        appState.feedback = data.feedback;
                        saveInterviewSessionToHistory(appState.userName, appState.selectedCandidate, appState.selectedPersona, data.feedback, appState.transcript);
                        navigateTo('feedback_report');
                        return;
                    } else {
                        appState.transcript.push({
                            role: 'interviewer',
                            content: data.reply,
                            focusReason: data.focusReason,
                            moduleN: data.moduleN
                        });
                        appState.questionsAsked++;
                        if (data.moduleN) {
                            appState.activeModule = data.moduleN;
                            appState.daysCoveredSet.add(data.moduleN * 3 - 1); // Mock mapping for visual representation
                            appState.daysCoveredCount = Math.min(4, appState.daysCoveredSet.size);
                        }
                        speakInterviewerText(data.reply);
                    }
                }
            } catch (err) {
                console.error("TURN failed, retrying API call:", err);
                try {
                    const retryRes = await fetch(`${getApiBase()}/api/interview`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sessionId: appState.sessionId,
                            message: message
                        })
                    });
                    if (retryRes.ok) {
                        const data = await retryRes.json();
                        if (data.verdict) appState.transcript[appState.transcript.length - 1].verdict = data.verdict;
                        if (data.done) {
                            stopInterviewTimer();
                            appState.feedback = data.feedback;
                            saveInterviewSessionToHistory(appState.userName, appState.selectedCandidate, appState.selectedPersona, data.feedback, appState.transcript);
                            navigateTo('feedback_report');
                            return;
                        }
                        appState.transcript.push({
                            role: 'interviewer',
                            content: data.reply,
                            focusReason: data.focusReason,
                            moduleN: data.moduleN
                        });
                        appState.questionsAsked++;
                        speakInterviewerText(data.reply);
                    }
                } catch (retryErr) {
                    console.error("Retry also failed:", retryErr);
                }
            } finally {
                appState.isTyping = false;
                render();
                scrollChat();
            }
        }

        async function endInterviewEarly() {
            if (!confirm("Are you sure you want to end this interview session?")) return;
            
            appState.isTyping = true;
            render();

            try {
                // Send dummy message or call directly to get summary
                const res = await fetch(`${getApiBase()}/api/interview`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: appState.sessionId,
                        message: "I am ready to end the interview now."
                    })
                });
                
                // Force ending fallback if we can't complete through standardcap
                if (res.ok) {
                    const data = await res.json();
                    if (data.done) {
                        appState.feedback = data.feedback;
                    } else {
                        // Generate mock feedback for early exit
                        appState.feedback = {
                            summary: "The interview was completed early by the interviewer.",
                            strengths: ["Willingness to participate"],
                            gaps: ["Assessment incomplete due to early exit"],
                            next: ["Schedule a follow-up session to complete the assessment"]
                        };
                    }
                }
            } catch (err) {
                appState.feedback = {
                    summary: "Interview session terminated early.",
                    strengths: ["Interactive communication"],
                    gaps: ["Incomplete assessment details"],
                    next: ["Re-initiate session to assess all days"]
                };
            } finally {
                appState.isTyping = false;
                saveInterviewSessionToHistory(appState.userName, appState.selectedCandidate, appState.selectedPersona, appState.feedback, appState.transcript);
                navigateTo('feedback_report');
            }
        }

        function renderOverallProgress() {
            const history = JSON.parse(localStorage.getItem('interviewiq_history') || '[]');
            
            let totalSessions = history.length;
            let totalStrong = 0;
            let totalPartial = 0;
            let totalGap = 0;
            
            history.forEach(h => {
                totalStrong += h.score?.strong || 0;
                totalPartial += h.score?.partial || 0;
                totalGap += h.score?.gap || 0;
            });
            
            let totalVerdicts = totalStrong + totalPartial + totalGap;
            let strongPercentage = totalVerdicts > 0 ? Math.round((totalStrong / totalVerdicts) * 100) : 0;
            let partialPercentage = totalVerdicts > 0 ? Math.round((totalPartial / totalVerdicts) * 100) : 0;
            let gapPercentage = totalVerdicts > 0 ? Math.round((totalGap / totalVerdicts) * 100) : 0;

        function renderFeedbackReport() {

            let strengthsHtml = '';

            });
            if (appState.feedback.strengths.length === 0) {
                strengthsHtml = `<span class="text-sm text-on-surface-variant">None recorded.</span>`;
            }

            let gapsHtml = '';
            appState.feedback.gaps.forEach(gap => {
                gapsHtml += `<span class="font-label-code text-label-code bg-error-container text-on-error-container px-2 py-1 rounded border border-border-subtle">${gap}</span>`;
            });
            if (appState.feedback.gaps.length === 0) {
                gapsHtml = `<span class="text-sm text-on-surface-variant">None recorded.</span>`;
            }

            let nextHtml = '';
            appState.feedback.next.forEach(step => {
                nextHtml += `
                    <label class="flex items-center gap-3 cursor-pointer py-1">
                        <input class="form-checkbox h-5 w-5 text-primary border-outline rounded bg-surface" type="checkbox"/>
                        <span class="font-body-md text-body-md text-on-surface">${step}</span>
                    </label>
                `;
            });

            // Reconstruct timeline of verdicts from transcript
            let timelineHtml = '';
            let qIdx = 1;
            appState.transcript.forEach((msg, idx) => {
                // If this is an interviewer question, find the candidate's answer following it
                if (msg.role === 'interviewer') {
